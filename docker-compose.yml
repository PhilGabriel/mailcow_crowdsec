services:
  # Read-only filter in front of the Docker socket. CrowdSec only needs
  # to list containers, read their logs and follow events. Direct socket
  # access would equal root on the host, even with :ro.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.6
    container_name: crowdsec-socket-proxy
    restart: always
    environment:
      CONTAINERS: 1
      ALLOW_LOGS: 1
      EVENTS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 0
      # Listen on IPv4 only. The proxy is reachable only on the internal
      # network, and hosts with IPv6 disabled would crash-loop otherwise.
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks:
      - socket-proxy
    security_opt:
      - no-new-privileges:true

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    container_name: crowdsec-mailcow
    restart: always
    depends_on:
      - socket-proxy
    environment:
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/base-http-scenarios crowdsecurity/dovecot crowdsecurity/postfix crowdsecurity/sshd"
      # Turns netfilter-mailcow bans (Mailcow UI, SOGo, Rspamd UI logins) into CrowdSec decisions
      PARSERS: "Guezli/mailcow-f2b-bans"
      SCENARIOS: "Guezli/mailcow-f2b-feed"
      # Optional: enroll with CrowdSec Central API
      # ENROLL_KEY: "${CROWDSEC_ENROLL_KEY}"
      # ENROLL_INSTANCE_NAME: "${CROWDSEC_INSTANCE_NAME}"
      TZ: "${TZ:-Europe/Berlin}"
      # SQLite write-ahead log, avoids the startup warning and improves performance
      USE_WAL: "true"
    volumes:
      - crowdsec-db:/var/lib/crowdsec/data/
      - crowdsec-config:/etc/crowdsec/
      # Long syntax: fail if auth.log is missing instead of
      # silently creating a directory at that path on the host
      - type: bind
        source: /var/log/auth.log
        target: /var/log/auth.log
        read_only: true
        bind:
          create_host_path: false
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
    networks:
      - default
      - socket-proxy
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

networks:
  # No outside access: only CrowdSec talks to the proxy
  socket-proxy:
    internal: true

volumes:
  crowdsec-db:
  crowdsec-config:
