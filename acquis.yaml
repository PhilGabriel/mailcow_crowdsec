# All Docker sources read through the socket proxy (see docker-compose.yml).

# Mailcow Nginx (webmail, admin UI)
source: docker
docker_host: tcp://socket-proxy:2375
container_name:
  - mailcowdockerized-nginx-mailcow-1
labels:
  type: nginx

---
# Dovecot (IMAP/POP3) and Postfix (SMTP)
# Mailcow writes both via syslog-ng in syslog format.
# type "syslog" lets crowdsecurity/syslog-logs extract the program name,
# which the dovecot and postfix parsers filter on.
source: docker
docker_host: tcp://socket-proxy:2375
container_name:
  - mailcowdockerized-dovecot-mailcow-1
  - mailcowdockerized-postfix-mailcow-1
labels:
  type: syslog

---
# netfilter-mailcow (Mailcow's built-in ban engine)
# Its ban lines cover logins CrowdSec has no parser for:
# Mailcow UI, SOGo and Rspamd UI. Guezli/mailcow-f2b-bans parses them,
# Guezli/mailcow-f2b-feed turns each ban into a CrowdSec decision.
source: docker
docker_host: tcp://socket-proxy:2375
container_name:
  - mailcowdockerized-netfilter-mailcow-1
labels:
  type: mailcow-f2b

---
# SSH auth logs
filenames:
  - /var/log/auth.log
labels:
  type: syslog
