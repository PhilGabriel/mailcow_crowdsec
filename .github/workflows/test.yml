name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck crowdsec.sh tests/run.sh
      - name: compose config
        run: docker compose config -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: auth.log for the bind mount
        run: sudo touch /var/log/auth.log
      - name: CrowdSec detects attacks in Mailcow logs
        run: ./tests/run.sh
