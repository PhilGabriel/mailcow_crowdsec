name: Feature request
description: Suggest a new log source, scenario or helper command.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which attack or task is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Name hub parsers, scenarios or containers if you know them.
    validations:
      required: true
  - type: checkboxes
    id: goals
    attributes:
      label: Project goals
      options:
        - label: Works without changes to Mailcow itself
        - label: Needs no direct Docker socket access for CrowdSec
